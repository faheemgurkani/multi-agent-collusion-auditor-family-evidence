simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 3
  seed: 1
  tags:
  - emergent_gemma_E
environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8
communication_network:
  topology: path
  num_agents: 4
  consolidate_channels: true
llm_models:
- label: gemma
  llm:
    provider: openrouter
    openrouter:
      model: gemma4-31b
      params:
        max_tokens: 3000
        temperature: 0.7
experiment:
  tag: emergent_gemma_E
  output_dir: /Users/muhammadfaheem/Local Projects/research/Apart Research/[Sprint]
    AI Collusion Research/src/data/runs/emergent/gemma/E
  max_concurrent_runs: 5
  seeds:
  - 101
  - 102
  - 103
  - 104
  - 105
  collusion:
    colluder_selection: first_and_last
    agent_order: random
    coalition_prompt: never
  sweeps:
  - name: emergent_gemma_E
    topologies:
    - path
    num_agents:
    - 4
    colluder_counts:
    - 2
    secret_channel_enabled:
    - true
    prompt_variants:
    - control
